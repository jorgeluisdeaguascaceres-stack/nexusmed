<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUSMED - Iniciar Sesión</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a1628;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ===== FONDO DECORATIVO ===== */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
        }

        .bg-circle-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #00b4d8, transparent);
            top: -150px;
            right: -100px;
        }

        .bg-circle-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #0077b6, transparent);
            bottom: -100px;
            left: -80px;
        }

        .bg-circle-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #90e0ef, transparent);
            top: 50%;
            left: 10%;
            opacity: 0.04;
        }

        /* Cruces decorativas */
        .cross {
            position: absolute;
            color: rgba(0, 180, 216, 0.1);
            font-size: 40px;
            font-weight: 300;
        }

        .cross-1 { top: 15%; left: 45%; }
        .cross-2 { top: 25%; right: 20%; font-size: 30px; }
        .cross-3 { bottom: 20%; left: 30%; font-size: 50px; opacity: 0.05; }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .login-wrapper {
            display: flex;
            align-items: center;
            gap: 80px;
            z-index: 10;
        }

        /* ===== LADO IZQUIERDO - FORMULARIO ===== */
        .login-form-container {
            width: 380px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
        }

        .brand-icon svg {
            width: 100%;
            height: 100%;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            color: #00b4d8;
            letter-spacing: 4px;
        }

        .login-box {
            background: linear-gradient(135deg, #0d2137, #122a45);
            border: 1px solid #1a3a5c;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        0 0 60px rgba(0, 180, 216, 0.05);
        }

        .login-title {
            font-size: 18px;
            font-weight: 600;
            color: #90e0ef;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #5a7a9a;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #5a7a9a;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background-color: #0a1628;
            border: 1px solid #1a3a5c;
            color: #e0e0e0;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .form-group input::placeholder {
            color: #3a5a7a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00b4d8;
            box-shadow: 0 0 12px rgba(0, 180, 216, 0.2);
        }

        .btn-ingresar {
            width: 100%;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-ingresar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
        }

        .btn-ingresar:active {
            transform: translateY(0);
        }

        /* ===== ENLACE CAMBIAR CONTRASEÑA ===== */
        .login-links {
            text-align: center;
            margin-top: 18px;
        }

        .link-pass {
            background: none;
            border: none;
            color: #5a7a9a;
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }

        .link-pass:hover {
            color: #00b4d8;
            background-color: rgba(0, 180, 216, 0.08);
        }

        /* ===== CAMPO CON OJO ===== */
        .input-pass {
            position: relative;
        }

        .input-pass input {
            padding-right: 44px;
        }

        .toggle-ojo {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #5a7a9a;
            cursor: pointer;
            font-size: 15px;
            padding: 8px 10px;
            line-height: 1;
            border-radius: 8px;
            transition: color 0.3s;
        }

        .toggle-ojo:hover { color: #00b4d8; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(4, 12, 24, 0.78);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.activo { display: flex; }

        .modal-caja {
            background: linear-gradient(135deg, #0d2137, #122a45);
            border: 1px solid #1a3a5c;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 26px 26px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
            animation: subir 0.25s ease;
        }

        @keyframes subir {
            from { transform: translateY(14px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        .modal-titulo {
            font-size: 17px;
            font-weight: 700;
            color: #90e0ef;
        }

        .modal-cerrar {
            background: none;
            border: none;
            color: #5a7a9a;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.3s;
        }

        .modal-cerrar:hover { color: #ff3860; }

        .modal-nota {
            font-size: 12.5px;
            color: #5a7a9a;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .modal-caja .form-group { margin-bottom: 16px; }

        .modal-caja .form-group input { padding: 12px 14px; font-size: 14px; }

        .ayuda-pass {
            font-size: 11.5px;
            color: #3a5a7a;
            margin-top: 6px;
        }

        .modal-acciones {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn-guardar,
        .btn-cancelar {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-guardar {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
            border: none;
        }

        .btn-guardar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 180, 216, 0.35);
        }

        .btn-cancelar {
            background-color: transparent;
            color: #5a7a9a;
            border: 1px solid #1a3a5c;
        }

        .btn-cancelar:hover {
            border-color: #ff3860;
            color: #ff3860;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
        }

        .login-footer .tagline {
            font-size: 14px;
            color: #00b4d8;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 1px;
        }

        /* ===== LADO DERECHO - ÍCONO MÉDICO ===== */
        .login-graphic {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .medical-icon-container {
            width: 280px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .medical-icon-container svg {
            width: 220px;
            height: 280px;
            filter: drop-shadow(0 0 20px rgba(0, 180, 216, 0.3));
        }

        .pulse-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid rgba(0, 180, 216, 0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 3s ease-in-out infinite;
        }

        .pulse-ring:nth-child(2) {
            width: 250px;
            height: 250px;
            animation-delay: 0.5s;
            border-color: rgba(0, 180, 216, 0.06);
        }

        .pulse-ring:nth-child(3) {
            width: 300px;
            height: 300px;
            animation-delay: 1s;
            border-color: rgba(0, 180, 216, 0.03);
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .toast-error {
            background: linear-gradient(135deg, #ff3860, #d4234a);
            color: #fff;
        }

        .toast-success {
            background: linear-gradient(135deg, #48c78e, #38a06d);
            color: #fff;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .login-wrapper {
                flex-direction: column;
                gap: 40px;
            }
            .login-graphic {
                display: none;
            }
            .login-form-container {
                width: 90%;
                max-width: 380px;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo decorativo -->
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="cross cross-1">+</div>
    <div class="cross cross-2">+</div>
    <div class="cross cross-3">+</div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Contenido -->
    <div class="login-wrapper">

        <!-- LADO IZQUIERDO: FORMULARIO -->
        <div class="login-form-container">
            <div class="brand-header">
                <div class="brand-icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <path d="M20 4 L20 36" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>
                        <path d="M20 10 L10 4" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>
                        <path d="M20 10 L30 4" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="20" cy="36" r="3" fill="#00b4d8"/>
                    </svg>
                </div>
                <div class="brand-name">NEXUSMED</div>
            </div>

            <div class="login-box">
                <div class="login-title">Bienvenido</div>
                <div class="login-subtitle">Ingrese sus credenciales para acceder al sistema</div>

                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingrese su usuario" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <div class="input-pass">
                        <input type="password" id="contrasena" placeholder="Ingrese su contraseña">
                        <button type="button" class="toggle-ojo" onclick="alternarVer('contrasena', this)" aria-label="Mostrar u ocultar la contraseña" title="Mostrar u ocultar">&#128065;</button>
                    </div>
                </div>

                <button class="btn-ingresar" onclick="validarLogin()">Ingresar</button>

                <div class="login-links">
                    <button type="button" class="link-pass" onclick="abrirModalPass()">&#128273; ¿Cambiar contraseña?</button>
                </div>
            </div>

            <div class="login-footer">
                <span class="tagline">plataforma que conecta todo</span>
            </div>
        </div>

        <!-- LADO DERECHO: ÍCONO MÉDICO -->
        <div class="login-graphic">
            <div class="medical-icon-container">
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <svg viewBox="0 0 220 280" fill="none">
                    <!-- Pilar central -->
                    <line x1="110" y1="40" x2="110" y2="240" stroke="#00b4d8" stroke-width="4" stroke-linecap="round"/>
                    <!-- Loop inferior -->
                    <ellipse cx="110" cy="250" rx="15" ry="12" stroke="#00b4d8" stroke-width="3" fill="none"/>
                    <!-- Hojas superiores (caduceo estilizado) -->
                    <!-- Hoja izquierda superior -->
                    <path d="M110 80 Q60 50 50 30 Q40 10 60 20 Q80 30 110 80" fill="rgba(0,180,216,0.3)" stroke="#00b4d8" stroke-width="2"/>
                    <!-- Hoja derecha superior -->
                    <path d="M110 80 Q160 50 170 30 Q180 10 160 20 Q140 30 110 80" fill="rgba(0,180,216,0.3)" stroke="#00b4d8" stroke-width="2"/>
                    <!-- Hoja izquierda media -->
                    <path d="M110 130 Q50 110 35 90 Q20 70 45 80 Q70 90 110 130" fill="rgba(0,180,216,0.2)" stroke="#00b4d8" stroke-width="2"/>
                    <!-- Hoja derecha media -->
                    <path d="M110 130 Q170 110 185 90 Q200 70 175 80 Q150 90 110 130" fill="rgba(0,180,216,0.2)" stroke="#00b4d8" stroke-width="2"/>
                    <!-- Hoja izquierda inferior -->
                    <path d="M110 180 Q45 160 30 145 Q15 130 40 135 Q65 140 110 180" fill="rgba(0,180,216,0.15)" stroke="#00b4d8" stroke-width="2"/>
                    <!-- Hoja derecha inferior -->
                    <path d="M110 180 Q175 160 190 145 Q205 130 180 135 Q155 140 110 180" fill="rgba(0,180,216,0.15)" stroke="#00b4d8" stroke-width="2"/>
                    <!-- Serpientes del caduceo -->
                    <path d="M110 40 Q95 60 90 80 Q85 100 95 110 Q105 120 110 110" stroke="#90e0ef" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path d="M110 40 Q125 60 130 80 Q135 100 125 110 Q115 120 110 110" stroke="#90e0ef" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <!-- Esfera central -->
                    <circle cx="110" cy="40" r="8" fill="#00b4d8"/>
                    <circle cx="110" cy="40" r="4" fill="#0a1628"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- ===== MODAL: CAMBIAR CONTRASEÑA ===== -->
    <div class="modal-overlay" id="modalPass" onclick="clicFueraModal(event)">
        <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="tituloModalPass">
            <div class="modal-head">
                <div class="modal-titulo" id="tituloModalPass">Cambiar contraseña</div>
                <button type="button" class="modal-cerrar" onclick="cerrarModalPass()" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-nota">Confirme su contraseña actual y defina la nueva. El cambio queda activo de inmediato para su próximo ingreso.</div>

            <div class="form-group">
                <label for="cpUsuario">Usuario</label>
                <input type="text" id="cpUsuario" placeholder="Su usuario" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="cpActual">Contraseña actual</label>
                <div class="input-pass">
                    <input type="password" id="cpActual" placeholder="Contraseña actual">
                    <button type="button" class="toggle-ojo" onclick="alternarVer('cpActual', this)" aria-label="Mostrar u ocultar la contraseña">&#128065;</button>
                </div>
            </div>

            <div class="form-group">
                <label for="cpNueva">Nueva contraseña</label>
                <div class="input-pass">
                    <input type="password" id="cpNueva" placeholder="Nueva contraseña">
                    <button type="button" class="toggle-ojo" onclick="alternarVer('cpNueva', this)" aria-label="Mostrar u ocultar la contraseña">&#128065;</button>
                </div>
                <div class="ayuda-pass">Mínimo 5 caracteres y distinta de la actual.</div>
            </div>

            <div class="form-group">
                <label for="cpConfirmar">Confirmar nueva contraseña</label>
                <div class="input-pass">
                    <input type="password" id="cpConfirmar" placeholder="Repita la nueva contraseña">
                    <button type="button" class="toggle-ojo" onclick="alternarVer('cpConfirmar', this)" aria-label="Mostrar u ocultar la contraseña">&#128065;</button>
                </div>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" onclick="cerrarModalPass()">Cancelar</button>
                <button type="button" class="btn-guardar" onclick="guardarNuevaPass()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // ===== USUARIOS POR DEFECTO =====
        const USUARIOS = [
            { usuario: 'admin', contrasena: 'admin123', password: 'admin123', nombre: 'Administrador', rol: 'admin' },
            { usuario: 'medico', contrasena: 'medico123', password: 'medico123', nombre: 'Dr. García', rol: 'medico' },
            { usuario: 'enfermera', contrasena: 'enfermera123', password: 'enfermera123', nombre: 'Enf. López', rol: 'enfermera' },
            { usuario: 'recepcion', contrasena: 'recep123', password: 'recep123', nombre: 'Ana Martínez', rol: 'recepcion' }
        ];

        // Guardar usuarios en localStorage si no existen
        if (!localStorage.getItem('nexus_usuarios')) {
            localStorage.setItem('nexus_usuarios', JSON.stringify(USUARIOS));
        }

        // ===== HELPERS DE USUARIOS =====
        function obtenerUsuarios() {
            try {
                const datos = JSON.parse(localStorage.getItem('nexus_usuarios'));
                return Array.isArray(datos) ? datos : [];
            } catch (e) {
                return [];
            }
        }

        // Acepta los dos nombres de campo usados en el sistema
        function claveDe(u) {
            return (u && (u.contrasena !== undefined && u.contrasena !== '' ? u.contrasena : u.password)) || '';
        }

        // ===== VALIDAR LOGIN =====
        function validarLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            if (!usuario) {
                mostrarToast('Ingrese su usuario', 'error');
                return;
            }
            if (!contrasena) {
                mostrarToast('Ingrese su contraseña', 'error');
                return;
            }

            const usuarios = obtenerUsuarios();
            const encontrado = usuarios.find(u => String(u.usuario).toLowerCase() === usuario.toLowerCase() && claveDe(u) === contrasena);

            if (encontrado) {
                // Guardar sesión
                const sesion = {
                    logueado: true,
                    usuario: encontrado.usuario,
                    nombre: encontrado.nombre,
                    rol: encontrado.rol,
                    horaLogin: new Date().toISOString()
                };
                localStorage.setItem('nexus_sesion', JSON.stringify(sesion));

                mostrarToast(`Bienvenido, ${encontrado.nombre}`, 'success');

                // Redirigir al menú
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 800);
            } else {
                mostrarToast('Usuario o contraseña incorrectos', 'error');
            }
        }

        // ===== TOAST =====
        function mostrarToast(mensaje, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${tipo}`;
            toast.textContent = mensaje;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== MOSTRAR / OCULTAR CONTRASEÑA =====
        function alternarVer(id, boton) {
            const campo = document.getElementById(id);
            if (!campo) return;
            const oculto = campo.type === 'password';
            campo.type = oculto ? 'text' : 'password';
            boton.style.color = oculto ? '#00b4d8' : '';
            boton.title = oculto ? 'Ocultar' : 'Mostrar';
        }

        // ===== MODAL: CAMBIAR CONTRASEÑA =====
        function abrirModalPass() {
            document.getElementById('cpUsuario').value = document.getElementById('usuario').value.trim();
            ['cpActual', 'cpNueva', 'cpConfirmar'].forEach(id => document.getElementById(id).value = '');
            document.querySelectorAll('#modalPass .input-pass input').forEach(i => i.type = 'password');
            document.getElementById('modalPass').classList.add('activo');
            const foco = document.getElementById('cpUsuario').value ? 'cpActual' : 'cpUsuario';
            setTimeout(() => document.getElementById(foco).focus(), 60);
        }

        function cerrarModalPass() {
            document.getElementById('modalPass').classList.remove('activo');
        }

        function modalPassAbierto() {
            return document.getElementById('modalPass').classList.contains('activo');
        }

        function clicFueraModal(evento) {
            if (evento.target.id === 'modalPass') cerrarModalPass();
        }

        function guardarNuevaPass() {
            const usuario = document.getElementById('cpUsuario').value.trim();
            const actual = document.getElementById('cpActual').value.trim();
            const nueva = document.getElementById('cpNueva').value.trim();
            const confirmar = document.getElementById('cpConfirmar').value.trim();

            if (!usuario) { mostrarToast('Ingrese su usuario', 'error'); return; }
            if (!actual) { mostrarToast('Ingrese su contraseña actual', 'error'); return; }
            if (!nueva) { mostrarToast('Ingrese la nueva contraseña', 'error'); return; }
            if (nueva.length < 5) { mostrarToast('La nueva contraseña debe tener al menos 5 caracteres', 'error'); return; }
            if (nueva === actual) { mostrarToast('La nueva contraseña debe ser distinta de la actual', 'error'); return; }
            if (nueva !== confirmar) { mostrarToast('Las contraseñas nuevas no coinciden', 'error'); return; }

            const usuarios = obtenerUsuarios();
            const idx = usuarios.findIndex(u => String(u.usuario).toLowerCase() === usuario.toLowerCase());
            if (idx === -1) { mostrarToast('El usuario no existe', 'error'); return; }
            if (claveDe(usuarios[idx]) !== actual) { mostrarToast('La contraseña actual no es correcta', 'error'); return; }

            // Se actualizan ambos campos para mantener compatibilidad con Configuración
            usuarios[idx].password = nueva;
            usuarios[idx].contrasena = nueva;
            usuarios[idx].fechaCambioClave = new Date().toISOString();

            try {
                localStorage.setItem('nexus_usuarios', JSON.stringify(usuarios));
            } catch (e) {
                mostrarToast('No se pudo guardar el cambio en este navegador', 'error');
                return;
            }

            cerrarModalPass();
            document.getElementById('usuario').value = usuarios[idx].usuario;
            document.getElementById('contrasena').value = '';
            document.getElementById('contrasena').focus();
            mostrarToast('Contraseña actualizada. Ingrese con la nueva contraseña', 'success');
        }

        // ===== TECLADO: ENTER / ESC =====
        document.addEventListener('keydown', (e) => {
            if (modalPassAbierto()) {
                if (e.key === 'Enter') guardarNuevaPass();
                if (e.key === 'Escape') cerrarModalPass();
                return;
            }
            if (e.key === 'Enter') validarLogin();
        });

        // ===== VERIFICAR SI YA HAY SESIÓN =====
        let sesion = null;
        try { sesion = JSON.parse(localStorage.getItem('nexus_sesion')); } catch (e) { sesion = null; }
        if (sesion && sesion.logueado) {
            // Ya está logueado, opcionalmente redirigir
            // window.location.href = 'menu.html';
        }
    </script>

</body>
</html>
