<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a1628; color:#c8d6e5; min-height:100vh; }

        /* HEADER */
        .header { background:linear-gradient(135deg,#0d2137,#1a3a5c); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #00b4d8; box-shadow:0 2px 15px rgba(0,180,216,.2); }
        .header-left { display:flex; align-items:center; gap:12px; }
        .brand-icon { width:32px; height:32px; }
        .brand-icon svg { width:100%; height:100%; }
        .brand-name { font-size:24px; font-weight:800; color:#00b4d8; letter-spacing:3px; }
        .brand-name span { color:#90e0ef; font-weight:300; }
        .header-right { display:flex; align-items:center; gap:20px; }
        .user-info { display:flex; align-items:center; gap:10px; }
        .user-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#00b4d8,#0077b6); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; }
        .user-details { display:flex; flex-direction:column; }
        .user-name { font-size:13px; font-weight:600; color:#c8d6e5; }
        .user-role { font-size:11px; color:#5a7a9a; text-transform:uppercase; letter-spacing:1px; }
        .btn-cerrar-sesion { background:transparent; color:#ff3860; border:1px solid #ff3860; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; transition:all .3s; }
        .btn-cerrar-sesion:hover { background:#ff3860; color:#fff; }

        /* NAV BAR */
        .nav-bar { background:#0d2137; padding:8px 30px; display:flex; gap:5px; border-bottom:1px solid #1a3a5c; flex-wrap:wrap; }
        .nav-item { padding:8px 16px; border-radius:6px; font-size:13px; color:#5a7a9a; cursor:pointer; transition:all .3s; text-decoration:none; display:flex; align-items:center; gap:6px; }
        .nav-item:hover { color:#00b4d8; background:rgba(0,180,216,.1); }
        .nav-item.active { color:#00b4d8; background:rgba(0,180,216,.15); border:1px solid rgba(0,180,216,.3); }

        /* MAIN */
        .main { max-width:1100px; margin:25px auto; padding:0 20px; }
        .page-title { font-size:22px; font-weight:800; color:#00b4d8; margin-bottom:6px; }
        .page-sub { font-size:13px; color:#5a7a9a; margin-bottom:20px; }

        /* CARDS */
        .card { background:linear-gradient(135deg,#0d2137,#122a45); border:1px solid #1a3a5c; border-radius:16px; padding:24px; margin-bottom:20px; }
        .card-title { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .step-num { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#fff; }
        .step-num.blue { background:linear-gradient(135deg,#00b4d8,#0077b6); }
        .step-num.green { background:linear-gradient(135deg,#48c78e,#38a06d); }
        .card-title h3 { font-size:16px; font-weight:700; color:#c8d6e5; }

        /* UPLOAD ZONE */
        .upload-zone { border:2px dashed #1a3a5c; border-radius:16px; padding:40px; text-align:center; cursor:pointer; transition:all .3s; background:rgba(0,180,216,.03); }
        .upload-zone:hover, .upload-zone.dragover { border-color:#00b4d8; background:rgba(0,180,216,.08); }
        .upload-icon { width:56px; height:56px; border-radius:50%; background:rgba(0,180,216,.15); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:24px; color:#00b4d8; }
        .upload-zone p { color:#5a7a9a; font-size:14px; }

        /* FILE INFO */
        .file-ok { display:none; margin-top:10px; padding:10px 16px; background:rgba(72,199,142,.1); border:1px solid rgba(72,199,142,.3); border-radius:10px; color:#48c78e; font-size:13px; font-weight:600; }

        /* INPUTS */
        .nx-input { background:#0a1628; border:1px solid #1a3a5c; border-radius:10px; padding:10px 14px; color:#c8d6e5; font-size:13px; font-family:inherit; width:100%; transition:border .3s; }
        .nx-input:focus { outline:none; border-color:#00b4d8; box-shadow:0 0 0 2px rgba(0,180,216,.2); }
        .nx-select { background:#0a1628; border:1px solid #1a3a5c; border-radius:10px; padding:10px 14px; color:#c8d6e5; font-size:13px; font-family:inherit; }
        .nx-label { display:block; font-size:12px; color:#5a7a9a; margin-bottom:6px; font-weight:600; }
        .nx-btn { border:none; border-radius:10px; padding:10px 20px; font-weight:700; cursor:pointer; font-size:13px; font-family:inherit; transition:all .3s; display:inline-flex; align-items:center; gap:8px; }
        .nx-btn-primary { background:linear-gradient(135deg,#00b4d8,#0090b3); color:#03202c; }
        .nx-btn-primary:hover { box-shadow:0 6px 20px rgba(0,180,216,.35); transform:translateY(-1px); }
        .nx-btn-success { background:linear-gradient(135deg,#48c78e,#38a06d); color:#fff; }
        .nx-btn-success:hover { box-shadow:0 6px 20px rgba(72,199,142,.35); transform:translateY(-1px); }
        .nx-btn-danger { background:transparent; color:#ff3860; border:1px solid #ff3860; padding:8px 14px; }
        .nx-btn-danger:hover { background:#ff3860; color:#fff; }
        .nx-btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }

        /* GRID */
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .grid-3-2 { display:grid; grid-template-columns:3fr 2fr; gap:20px; }
        @media(max-width:768px) { .grid-2, .grid-3-2 { grid-template-columns:1fr; } }

        /* PREVIEW */
        #pdf-preview-canvas { max-width:100%; height:auto; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.4); }
        .preview-wrap { background:#0a1628; border-radius:12px; padding:12px; border:1px solid #1a3a5c; }

        /* FIELDS LIST */
        .field-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; margin-bottom:6px; font-size:13px; }
        .field-item.fecha { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); }
        .field-item.cita { background:rgba(139,92,246,.08); border:1px solid rgba(139,92,246,.2); }
        .field-item.formato { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.2); }
        .field-item.custom { background:rgba(6,182,212,.08); border:1px solid rgba(6,182,212,.2); }
        .field-item.pagina { background:rgba(16,185,129,.08); border:1px solid rgba(16,185,129,.2); }
        .field-item.disabled { opacity:.35; }
        .field-tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; }
        .field-tag.fecha { background:rgba(239,68,68,.2); color:#ef4444; }
        .field-tag.cita { background:rgba(139,92,246,.2); color:#8b5cf6; }
        .field-tag.formato { background:rgba(245,158,11,.2); color:#f59e0b; }
        .field-tag.custom { background:rgba(6,182,212,.2); color:#06b6d4; }
        .field-tag.pagina { background:rgba(16,185,129,.2); color:#10b981; }

        /* OVERLAY */
        .overlay-rect { position:absolute; border:2px solid; border-radius:2px; cursor:pointer; pointer-events:all; transition:all .15s; z-index:10; }
        .overlay-rect:hover { filter:brightness(1.3); }
        .overlay-rect.fecha { border-color:#ef4444; background:rgba(239,68,68,.15); }
        .overlay-rect.cita { border-color:#8b5cf6; background:rgba(139,92,246,.15); }
        .overlay-rect.formato { border-color:#f59e0b; background:rgba(245,158,11,.15); }
        .overlay-rect.custom { border-color:#06b6d4; background:rgba(6,182,212,.15); }
        .overlay-rect.pagina { border-color:#10b981; background:rgba(16,185,129,.15); }
        .overlay-rect.disabled { opacity:.25; border-style:dashed; }

        /* DATES */
        .date-item { display:flex; align-items:center; gap:8px; padding:8px 12px; background:rgba(0,180,216,.05); border:1px solid #1a3a5c; border-radius:8px; margin-bottom:4px; animation:fadeIn .3s ease; font-size:13px; }
        .date-item .num { color:#5a7a9a; font-size:11px; min-width:24px; }
        .date-item .orig { color:#c8d6e5; flex:1; }
        .date-item .fmt { color:#00b4d8; font-family:monospace; font-weight:600; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }

        /* EXTRACTED TEXT */
        .extracted-box { background:#0a1628; border:1px solid #1a3a5c; border-radius:8px; padding:10px; font-size:11px; font-family:monospace; color:#5a7a9a; max-height:100px; overflow-y:auto; white-space:pre-wrap; }

        /* DATE RANGES */
        .range-box { background:rgba(0,180,216,.06); border:1px solid rgba(0,180,216,.2); border-radius:12px; padding:14px; }
        .range-box h4 { font-size:12px; font-weight:700; color:#00b4d8; margin-bottom:10px; }

        /* RADIO */
        .nx-radio { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; color:#c8d6e5; cursor:pointer; }
        .nx-radio input[type=radio] { accent-color:#00b4d8; }

        /* PROGRESS */
        .progress-wrap { width:100%; background:#1a3a5c; border-radius:10px; height:10px; overflow:hidden; margin-top:12px; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#00b4d8,#48c78e); border-radius:10px; transition:width .3s; }

        /* TOAST */
        .toast-container { position:fixed; top:20px; right:20px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
        .toast { padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 25px rgba(0,0,0,.4); animation:slideIn .3s ease,fadeOut .3s ease 2.7s; display:flex; align-items:center; gap:8px; }
        .toast-success { background:linear-gradient(135deg,#48c78e,#38a06d); color:#fff; }
        .toast-error { background:linear-gradient(135deg,#ff3860,#d63031); color:#fff; }
        .toast-info { background:linear-gradient(135deg,#00b4d8,#0077b6); color:#fff; }
        @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes fadeOut { from{opacity:1} to{opacity:0} }

        /* RESPONSIVE */
        @media(max-width:768px) { .header{flex-direction:column;gap:10px} .header-right{flex-wrap:wrap;justify-content:center} .nav-bar{justify-content:center} .grid-2,.grid-3-2{grid-template-columns:1fr} }
    
/* ── Sidebar + Panel Layout v2.8 ── */

</style>

    <script>
    /* ===== SESSION CHECK ===== */
    const sesion = JSON.parse(localStorage.getItem('nexus_sesion'));
    if (!sesion || !sesion.logueado) window.location.href = 'index.html';
    else {
        document.getElementById('userName').textContent = sesion.nombre;
        document.getElementById('userRole').textContent = sesion.rol.toUpperCase();
        document.getElementById('userAvatar').textContent = sesion.nombre.charAt(0).toUpperCase();
    }
    function cerrarSesion() { localStorage.removeItem('nexus_sesion'); window.location.href = 'index.html'; }

    /* ===== PERMISOS CHECK ===== */
    if (window.NX) NX.iniciar('generador_evoluciones', {});

    /* ===== PDF.js ===== */
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let originalPdfBytes = null, extractedTextItems = [], detectedFields = [], dates = [], pdfPage = null, pageViewport = null, pdfDocument = null, fieldIdCounter = 0;
    const MONTHS_ES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

    /* ===== UPLOAD ===== */
    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); const file = e.dataTransfer.files[0]; if (file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) handleFile(file); else showToast('Solo se aceptan archivos PDF','error'); });
    fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

    async function handleFile(file) {
        if (file.size > 15*1024*1024) { showToast('Archivo muy grande (máx 15 MB)','error'); return; }
        document.getElementById('step1-status').innerHTML = '<i class="fas fa-spinner fa-spin" style="color:#00b4d8"></i> <span style="color:#00b4d8">Procesando...</span>';
        try {
            const arrayBuffer = await file.arrayBuffer();
            originalPdfBytes = new Uint8Array(arrayBuffer);
            pdfDocument = await pdfjsLib.getDocument({data:originalPdfBytes.slice()}).promise;
            pdfPage = await pdfDocument.getPage(1);
            document.getElementById('file-info').style.display = 'block';
            document.getElementById('file-name').textContent = file.name + ' (' + (file.size/1024).toFixed(0) + ' KB)';
            document.getElementById('step1-status').innerHTML = '<i class="fas fa-check-circle" style="color:#48c78e"></i> <span style="color:#48c78e">OK</span>';
            await extractAndPreview();
            ['step2','step3','step4'].forEach(id => document.getElementById(id).style.display = 'block');
            updateGenSummary();
            showToast('PDF cargado correctamente','success');
        } catch(err) {
            document.getElementById('step1-status').innerHTML = '<i class="fas fa-times-circle" style="color:#ff3860"></i> <span style="color:#ff3860">Error</span>';
            showToast('Error: ' + err.message,'error');
        }
    }

    function resetUpload() {
        originalPdfBytes = null; pdfDocument = null; pdfPage = null; detectedFields = []; dates = [];
        fileInput.value = '';
        document.getElementById('file-info').style.display = 'none';
        document.getElementById('step1-status').innerHTML = '';
        ['step2','step3','step4'].forEach(id => document.getElementById(id).style.display = 'none');
    }

    /* ===== EXTRACT & PREVIEW ===== */
    async function extractAndPreview() {
        const scale = 2.0;
        pageViewport = pdfPage.getViewport({scale});
        const canvas = document.getElementById('pdf-preview-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = pageViewport.width; canvas.height = pageViewport.height;
        await pdfPage.render({canvasContext:ctx, viewport:pageViewport}).promise;
        const textContent = await pdfPage.getTextContent();
        extractedTextItems = textContent.items.filter(item => item.str.trim().length > 0);
        document.getElementById('extracted-text').textContent = extractedTextItems.map(item => item.str).join(' ');
        detectFields();
        renderFieldOverlays();
        renderFieldsList();
    }

    /* ===== FIELD DETECTION ===== */
    function detectFields() {
        detectedFields = []; fieldIdCounter = 0;
        const datePatterns = [/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/, /\d{1,2}[\/\-][A-Za-záéíóúñ]{3,5}[\/\-]\d{2,4}/i];
        let pendingLabel = null;
        for (let i = 0; i < extractedTextItems.length; i++) {
            const item = extractedTextItems[i]; const text = item.str.trim();
            if (/fecha/i.test(text) && !/hora/i.test(text)) pendingLabel = 'fecha';
            if (/no\.?\s*de\s*cita/i.test(text)) pendingLabel = 'cita';
            if (/formato\s*no/i.test(text)) pendingLabel = 'formato';
            if (/página\s*\d+\s*de\s*\d+/i.test(text) || /pagina\s*\d+\s*de\s*\d+/i.test(text)) addDetectedField('pagina','Página',text,item);
            for (const pat of datePatterns) { if (pat.test(text)) { addDetectedField('fecha','Fecha',text,item); pendingLabel = null; break; } }
            if (pendingLabel && /^\d+$/.test(text)) {
                const label = pendingLabel === 'cita' ? 'No. de Cita' : pendingLabel === 'formato' ? 'Formato No.' : 'Fecha (num)';
                addDetectedField(pendingLabel,label,text,item); pendingLabel = null;
            }
        }
        if (!detectedFields.some(f => f.type === 'pagina')) {
            for (let i = 0; i < extractedTextItems.length; i++) {
                const t = extractedTextItems[i].str.trim();
                if (/^página$/i.test(t) || /^pagina$/i.test(t)) {
                    const combined = t + ' ' + extractedTextItems.slice(i+1,i+4).map(x=>x.str.trim()).join(' ');
                    if (/página\s*\d+\s*de\s*\d+/i.test(combined) || /pagina\s*\d+\s*de\s*\d+/i.test(combined)) addDetectedField('pagina','Página',combined.replace(/\s+/g,' '),extractedTextItems[i]);
                }
            }
        }
        if (!detectedFields.some(f => f.type === 'fecha')) {
            for (let i = 0; i < extractedTextItems.length; i++) {
                if (/^FECHA$/i.test(extractedTextItems[i].str.trim())) {
                    for (let j = i + 1; j < Math.min(i + 5, extractedTextItems.length); j++) {
                        if (extractedTextItems[j].str.trim().length > 1) { addDetectedField('fecha','Fecha (fallback)',extractedTextItems[j].str.trim(),extractedTextItems[j]); break; }
                    }
                    break;
                }
            }
        }
    }

    function addDetectedField(type,label,text,item) {
        if (detectedFields.some(f => f.type === type && Math.abs(f.srcX - item.transform[4]) < 3 && Math.abs(f.srcY - item.transform[5]) < 3)) return;
        const id = fieldIdCounter++; const fontSize = Math.max(Math.abs(item.transform[0]),Math.abs(item.transform[3]),8);
        detectedFields.push({ id,type,label,searchText:text, srcX:item.transform[4],srcY:item.transform[5],srcFontSize:fontSize, itemWidth:item.width||fontSize*text.length*0.55,itemHeight:item.height||fontSize,enabled:true });
    }

    function renderFieldOverlays() {
        document.querySelectorAll('.overlay-rect').forEach(el => el.remove());
        const container = document.getElementById('preview-container');
        for (const field of detectedFields) {
            const div = document.createElement('div');
            div.className = `overlay-rect ${field.type} ${field.enabled?'':'disabled'}`;
            const vp = pageViewport;
            const [cx,cy] = vp.convertToViewportPoint(field.srcX,field.srcY);
            const topY = cy - field.srcFontSize * vp.scale;
            const w = Math.max(field.itemWidth * vp.scale,50);
            const h = field.srcFontSize * vp.scale * 1.5;
            div.style.left = (cx-2)+'px'; div.style.top = (topY-2)+'px'; div.style.width = (w+4)+'px'; div.style.height = (h+4)+'px';
            const tag = field.type==='fecha'?'📅':field.type==='cita'?'🔢':field.type==='formato'?'📋':'✏️';
            div.innerHTML = '<span style="font-size:8px;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:2px;position:absolute;top:-16px;left:0;white-space:nowrap">'+tag+' '+field.label+': "'+field.searchText+'"</span>';
            div.addEventListener('click', e => { e.stopPropagation(); toggleField(field.id); });
            container.appendChild(div);
        }
    }

    function toggleField(id) { const f = detectedFields.find(f => f.id === id); if (f) { f.enabled = !f.enabled; renderFieldOverlays(); renderFieldsList(); } }
    function removeField(id) { detectedFields = detectedFields.filter(f => f.id !== id); renderFieldOverlays(); renderFieldsList(); }

    function renderFieldsList() {
        const c = document.getElementById('fields-list'); c.innerHTML = '';
        for (const field of detectedFields) {
            const icons = {fecha:'📅',cita:'🔢',formato:'📋',custom:'✏️',pagina:'📄'};
            const bold = (field.type==='cita'||field.type==='formato'||field.type==='pagina') ? 'font-weight:700' : '';
            const div = document.createElement('div');
            div.className = `field-item ${field.type} ${field.enabled?'':'disabled'}`;
            div.innerHTML = `
                <button onclick="toggleField(${field.id})" style="width:18px;height:18px;border-radius:4px;border:1px solid ${field.enabled?'#00b4d8':'#1a3a5c'};background:${field.enabled?'#00b4d8':'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                    ${field.enabled?'<i class="fas fa-check" style="color:#fff;font-size:9px"></i>':''}
                </button>
                <span class="field-tag ${field.type}">${icons[field.type]||'✏️'} ${field.label}</span>
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;color:#c8d6e5;${bold}">"${field.searchText}" ${field.type==='pagina'?'→ PÁGINA':bold?'→ NEGRILLA':''}</span>
                <button onclick="removeField(${field.id})" style="background:none;border:none;color:#ff3860;cursor:pointer;font-size:11px;flex-shrink:0"><i class="fas fa-times"></i></button>
            `;
            c.appendChild(div);
        }
        if (!detectedFields.length) c.innerHTML = '<p style="font-size:13px;color:#5a7a9a;font-style:italic">No se detectaron campos.</p>';
    }

    function addCustomField() {
        const findText = document.getElementById('custom-find').value.trim();
        const type = document.getElementById('custom-type').value;
        if (!findText) { showToast('Escribe el texto','error'); return; }
        let found = extractedTextItems.find(item => item.str.includes(findText));
        if (found) { addDetectedField(type,findText,findText,found); renderFieldOverlays(); }
        else { detectedFields.push({ id:fieldIdCounter++,type,label:findText,searchText:findText,srcX:0,srcY:0,srcFontSize:10,itemWidth:80,itemHeight:12,enabled:true,noPosition:true }); }
        renderFieldsList(); document.getElementById('custom-find').value = ''; showToast('Campo agregado','success');
    }

    /* ===== DATES ===== */
    function generateDateRange() {
        const start = document.getElementById('range-start').value;
        const end = document.getElementById('range-end').value;
        const interval = parseInt(document.getElementById('range-interval').value)||1;
        const weekdaysOnly = document.getElementById('weekdays-only').checked;
        if (!start||!end) { showToast('Selecciona inicio y fin','error'); return; }
        const s = new Date(start+'T12:00:00'), e = new Date(end+'T12:00:00');
        if (s > e) { showToast('Inicio debe ser menor','error'); return; }
        const nd = []; let c = new Date(s);
        while (c <= e) { if (!weekdaysOnly||(c.getDay()!==0&&c.getDay()!==6)) nd.push(c.toISOString().split('T')[0]); c.setDate(c.getDate()+interval); }
        dates = [...new Set([...dates,...nd])].sort(); renderDatesList(); updateGenSummary(); showToast(`${nd.length} fechas generadas`,'success');
    }
    function addManualDate() { const v = document.getElementById('manual-date').value; if (!v) return; if (!dates.includes(v)) { dates.push(v); dates.sort(); } renderDatesList(); updateGenSummary(); }
    function removeDate(i) { dates.splice(i,1); renderDatesList(); updateGenSummary(); }
    function clearAllDates() { dates=[]; renderDatesList(); updateGenSummary(); }

    function formatDateStr(dateStr) {
        const fmt = document.querySelector('input[name="date-format"]:checked').value;
        const d = new Date(dateStr+'T12:00:00');
        const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'), yy = String(d.getFullYear()).slice(-2);
        switch(fmt) {
            case 'dd/mm/yyyy': return `${dd}/${mm}/${d.getFullYear()}`;
            case 'dd-mm-yyyy': return `${dd}-${mm}-${d.getFullYear()}`;
            case 'dd-AAA-yy': return `${dd}-${MONTHS_ES[d.getMonth()]}-${yy}`;
            default: return `${dd}/${mm}/${d.getFullYear()}`;
        }
    }

    function renderDatesList() {
        const c = document.getElementById('dates-list'); c.innerHTML = '';
        dates.forEach((date,i) => {
            const div = document.createElement('div'); div.className = 'date-item';
            div.innerHTML = `<span class="num">${i+1}.</span><span class="orig">${date}</span><span class="fmt">→ ${formatDateStr(date)}</span><button onclick="removeDate(${i})" style="background:none;border:none;color:#ff3860;cursor:pointer;font-size:11px"><i class="fas fa-times"></i></button>`;
            c.appendChild(div);
        });
        document.getElementById('date-count').textContent = dates.length;
    }

    function updateGenSummary() {
        const n = dates.length;
        const cs = parseInt(document.getElementById('cita-start').value)||1;
        const ci = parseInt(document.getElementById('cita-increment').value)||1;
        const fs = parseInt(document.getElementById('formato-start').value)||1;
        const fi = parseInt(document.getElementById('formato-increment').value)||1;
        document.getElementById('gen-summary-text').textContent = `${n} evolución${n!==1?'es':''}`;
        document.getElementById('gen-detail-text').textContent = n>0 ? `Cita ${cs}→${cs+(n-1)*ci} (+${ci}) | Formato ${fs}→${fs+(n-1)*fi} (+${fi})` : 'Agrega fechas';
    }

    document.getElementById('cita-start').addEventListener('input', updateGenSummary);
    document.getElementById('cita-increment').addEventListener('input', updateGenSummary);
    document.getElementById('formato-start').addEventListener('input', updateGenSummary);
    document.getElementById('formato-increment').addEventListener('input', updateGenSummary);
    document.querySelectorAll('input[name="date-format"]').forEach(r => r.addEventListener('change', () => { renderDatesList(); updateGenSummary(); }));

    /* ===== PDF GENERATION ===== */
    async function generatePDF() {
        if (dates.length === 0) { showToast('Agrega al menos una fecha','error'); return; }
        if (detectedFields.filter(f => f.enabled).length === 0) { showToast('Activa al menos un campo','error'); return; }
        const btn = document.getElementById('generate-btn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando...';
        document.getElementById('progress-bar').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        try {
            const citaStart = parseInt(document.getElementById('cita-start').value)||1;
            const formatoStart = parseInt(document.getElementById('formato-start').value)||1;
            const citaIncrement = parseInt(document.getElementById('cita-increment').value)||1;
            const formatoIncrement = parseInt(document.getElementById('formato-increment').value)||1;
            const paginaStart = parseInt(document.getElementById('pagina-start').value)||1;
            const paginaTotal = parseInt(document.getElementById('pagina-total').value)||1;
            const coverPadding = parseFloat(document.getElementById('cover-padding').value)||0.5;
            const enabledFields = detectedFields.filter(f => f.enabled);
            const { jsPDF } = window.jspdf;
            const vp1 = pdfPage.getViewport({scale:1});
            const pageWmm = vp1.width * 25.4 / 96;
            const pageHmm = vp1.height * 25.4 / 96;
            const doc = new jsPDF({ orientation:pageWmm>pageHmm?'landscape':'portrait', unit:'mm', format:[pageWmm,pageHmm] });
            const renderScale = 4;
            const renderVp = pdfPage.getViewport({scale:renderScale});
            const renderCanvas = document.createElement('canvas');
            renderCanvas.width = renderVp.width; renderCanvas.height = renderVp.height;
            const renderCtx = renderCanvas.getContext('2d');
            await pdfPage.render({canvasContext:renderCtx,viewport:renderVp}).promise;
            const pageImage = renderCanvas.toDataURL('image/jpeg',0.95);
            function toMM(srcX,srcY) { return [srcX*25.4/96, pageHmm-(srcY*25.4/96)]; }
            function pxToPt(px) { return px*72/96; }
            function pxToMM(px) { return px*25.4/96; }
            for (let i = 0; i < dates.length; i++) {
                if (i > 0) doc.addPage([pageWmm,pageHmm]);
                doc.addImage(pageImage,'JPEG',0,0,pageWmm,pageHmm);
                for (const field of enabledFields) {
                    if (field.noPosition) continue;
                    let replacementText = ''; let useBold = false;
                    if (field.type==='fecha') replacementText = formatDateStr(dates[i]);
                    else if (field.type==='cita') { replacementText = String(citaStart+i*citaIncrement); useBold=true; }
                    else if (field.type==='formato') { replacementText = String(formatoStart+i*formatoIncrement); useBold=true; }
                    else if (field.type==='pagina') { replacementText = 'Página '+(paginaStart+i)+' de '+paginaTotal; useBold=true; }
                    else replacementText = formatDateStr(dates[i]);
                    const [xMM_base,yMM_base] = toMM(field.srcX,field.srcY);
                    const fsPt = pxToPt(field.srcFontSize); const fsMM = pxToMM(field.srcFontSize);
                    const origW = pxToMM(field.itemWidth||field.srcFontSize*field.searchText.length*0.55);
                    const replW = fsPt*doc.getStringUnitWidth(replacementText)/72*25.4;
                    const rectW = Math.max(origW,replW)+coverPadding*0.6;
                    const rectH = fsMM*0.92+coverPadding*0.2;
                    const rectX = xMM_base-coverPadding*0.15;
                    const rectY = yMM_base-fsMM*0.75;
                    doc.setFillColor(255,255,255); doc.setDrawColor(255,255,255);
                    doc.rect(rectX,rectY,rectW,rectH,'FD');
                    doc.setFont('helvetica',useBold?'bold':'normal');
                    doc.setFontSize(fsPt); doc.setTextColor(0,0,0);
                    doc.text(replacementText,xMM_base,yMM_base-fsMM*0.15);
                }
                const pct = Math.round(((i+1)/dates.length)*100);
                document.getElementById('progress-fill').style.width = pct+'%';
                document.getElementById('progress-text').textContent = `Evolución ${i+1} de ${dates.length}...`;
            }
            doc.save('evoluciones_generadas.pdf');
            document.getElementById('progress-text').textContent = '✅ ¡PDF descargado!';
            showToast(`${dates.length} evoluciones generadas`,'success');
        } catch(err) {
            showToast('Error: '+err.message,'error');
            document.getElementById('progress-text').textContent = '❌ Error';
        } finally {
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Generar y Descargar PDF';
        }
    }

    /* ===== TOAST ===== */
    function showToast(msg,type='info') {
        const c = document.getElementById('toastContainer');
        const d = document.createElement('div');
        d.className = `toast toast-${type==='success'?'success':type==='error'?'error':'info'}`;
        const icon = type==='success'?'check-circle':type==='error'?'exclamation-triangle':'info-circle';
        d.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
        c.appendChild(d); setTimeout(()=>d.remove(),3000);
    }
    </script>
<script>
/* ── Sidebar panel switching v2.8 ── */
const PANEL_INIT={};
function switchPanel(pid){
  document.querySelectorAll('.config-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(s=>s.classList.remove('active'));
  const panel=document.getElementById('panel-'+pid);
  if(panel)panel.classList.add('active');
  const item=document.querySelector('[data-panel="'+pid+'"]');
  if(item)item.classList.add('active');
  if(!PANEL_INIT[pid]){PANEL_INIT[pid]=true;}
}
</script>
<script>
    function irAPaso(n) {
      const map = {1:'step1',2:'step2',3:'step3',4:'step4'};
      switchPanel(map[n] || 'step1');
    }
    </script>
</div>
